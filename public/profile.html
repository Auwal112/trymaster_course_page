<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — SkillForge</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <header>
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">Skill<span>Forge</span></a>
      <div class="nav-actions">
        <a href="index.html" class="btn-login">Browse Courses</a>
        <a href="auth.html" class="btn-cart">Log Out</a>
      </div>
    </div>
  </header>

  <main class="container catalog-section">
    <!-- User Header Card -->
    <div style="background: var(--surface); padding: 28px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        <h1 style="font-size: 1.6rem; margin-bottom: 4px;">Welcome, Amina Bello</h1>
        <p style="color: var(--text-muted);">amina.bello@example.com &bull; Member since 2026</p>
      </div>
      <div style="text-align: right;">
        <span style="background: #dbeafe; color: var(--primary); font-weight: 700; padding: 6px 14px; border-radius: 999px; font-size: 0.9rem;">
          2 Enrolled Courses
        </span>
      </div>
    </div>

    <!-- Enrolled Courses Grid -->
    <div class="section-header">
      <h2>My Learning</h2>
    </div>

    <div class="course-grid">
      <article class="course-card">
        <div class="thumb thumb-1">&#9889;</div>
        <div class="card-body">
          <h3 class="course-title">Node.js &amp; Express Zero to Production</h3>
          <p class="instructor">Progress: 65% Completed</p>
          <div style="background: var(--border); height: 8px; border-radius: 999px; overflow: hidden; margin-bottom: 16px;">
            <div style="background: var(--primary); width: 65%; height: 100%;"></div>
          </div>
          <div class="card-footer">
            <a href="course.html" class="btn-primary" style="width: 100%; text-align: center; padding: 10px;">Continue Learning</a>
          </div>
        </div>
      </article>

      <article class="course-card">
        <div class="thumb thumb-2">&#127912;</div>
        <div class="card-body">
          <h3 class="course-title">Modern HTML5 &amp; CSS3 Grid Mastery</h3>
          <p class="instructor">Progress: 100% Completed</p>
          <div style="background: var(--border); height: 8px; border-radius: 999px; overflow: hidden; margin-bottom: 16px;">
            <div style="background: #10b981; width: 100%; height: 100%;"></div>
          </div>
          <div class="card-footer">
            <a href="course.html" class="btn-primary" style="width: 100%; text-align: center; padding: 10px; background: #10b981;">Review Course</a>
          </div>
        </div>
      </article>
    </div>
  </main>

</body>
</html>
